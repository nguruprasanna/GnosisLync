[project]
name = "gnosislync"
version = "0.0.1"
description = "GnosisLync — Svarm Banking Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.7",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gnosis", "services/gnosis_api"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no I/O",
    "db: requires PostgreSQL (testcontainers or GNOSIS_TEST_DATABASE_URL)",
    "contract: OpenAPI / consumer contract tests",
    "security: authorisation, isolation, PII, guards",
    "knowledge: knowledge-model invariants",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["gnosis", "gnosis_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415", "PLR0917"]
"db/migrations/**" = ["S608"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gnosis", "gnosis_api"]
mypy_path = "services"

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["gnosis", "gnosis_api"]

[[tool.importlinter.contracts]]
name = "Adapters only produce snapshots: no access to knowledge, review or retrieval"
type = "forbidden"
source_modules = ["gnosis.adapters"]
forbidden_modules = ["gnosis.knowledge", "gnosis.review", "gnosis.retrieval"]

[[tool.importlinter.contracts]]
name = "Core package does not depend on deployables"
type = "forbidden"
source_modules = ["gnosis"]
forbidden_modules = ["gnosis_api"]

[[tool.importlinter.contracts]]
name = "Knowledge model is independent of skills, ingestion and discovery"
type = "forbidden"
source_modules = ["gnosis.knowledge"]
forbidden_modules = ["gnosis.skills", "gnosis.ingestion", "gnosis.discovery", "gnosis.adapters"]

[tool.ruff.lint.isort]
known-first-party = ["gnosis", "gnosis_api", "tests"]
