# Pull-request and main-branch gates (docs/architecture/09-quality-gates-testing.md §3.2).
# Phase 0 subset: static, secrets, unit + DB (isolation/privacy/lifecycle), coverage, dependency audit.
# Later phases add: contract (schemathesis/pact), evals, EKWORLD regression, SBOM/image scanning.
# Supply chain: third-party actions are pinned to commit SHAs and images to digests; the version comment is
# informational. Update both together (e.g. via Dependabot).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.20"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          # v8.30.1, pinned by digest
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.20"
      - run: uv sync --frozen
      - name: unit + database tests (Testcontainers, pgvector/pgvector:pg16)
        run: uv run pytest --cov --cov-report=json --cov-report=term
      - name: critical-area coverage gates
        run: uv run python scripts/check_coverage.py coverage.json

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.20"
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
      # export pins every transitive dependency, so audit the list as-is (no resolver venv needed)
      - run: uv run pip-audit -r requirements.txt --no-deps --disable-pip --strict
