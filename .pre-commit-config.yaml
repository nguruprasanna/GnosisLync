# Local convenience gates (docs/architecture/09 §3.1). NOT a security control: CI enforces the same
# checks server-side on protected branches.
#   uv run pre-commit install && uv run pre-commit install --hook-type pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: module boundaries
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: unit-tests
        name: unit tests
        entry: uv run pytest -m unit -q
        language: system
        pass_filenames: false
        types: [python]
      - id: db-tests
        name: database tests (pre-push; needs Docker)
        entry: uv run pytest -m db -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(db/|gnosis/|services/|tests/db/)
